require conf/distro/voltumna.conf

DISTRO_NAME = "CCD"
SDK_VENDOR = "-ccdsdk"
TARGET_VENDOR = "-ccd"

# Necessary to add lapack
FORTRAN:forcevariable = ",fortran"
RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"

# complete_grub_bootloader_conf (IMAGE_PREPROCESS_COMMAND, run inside
# do_image) reads ${DEPLOY_DIR_IMAGE}/grub.cfg: EXTRA_IMAGEDEPENDS only
# covers do_image_complete:do_populate_sysroot, so the explicit ordering on
# do_deploy is needed too.
do_image[depends] += "grub-bootconf:do_deploy"
