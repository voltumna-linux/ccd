require conf/distro/voltumna.conf

DISTRO_NAME = "CCD"
SDK_VENDOR = "-ccdsdk"
TARGET_VENDOR = "-ccd"

OLDEST_KERNEL = "6.18"
LINUXLIBCVERSION = "6.18"
PREFERRED_VERSION_virtual/kernel ?= "6.18%"
PREFERRED_VERSION_linux-libc-headers ?= "6.18%"
PREFERRED_VERSION_linux-intel = "${PREFERRED_VERSION_virtual/kernel}"
PREFERRED_VERSION_linux-amd = "6.18.33"

PREFERRED_VERSION_nativesdk-libgfortran = "${GCCVERSION}"

PREFERRED_VERSION_tango-idl = "6.0%"
PREFERRED_VERSION_nativesdk-tango-idl = "6.0%"
PREFERRED_VERSION_cpptango = "10.3.%"
PREFERRED_VERSION_nativesdk-cpptango = "10.3.%"
PREFERRED_VERSION_python3-pytango = "10.3.%"
PREFERRED_VERSION_nativesdk-python3-pytango = "10.3.%"
PREFERRED_VERSION_nativesdk-pogo = "9.10%"

# Necessary to add lapack
FORTRAN:forcevariable = ",fortran"
RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"
HOSTTOOLS += "gfortran"

# complete_grub_bootloader_conf (IMAGE_PREPROCESS_COMMAND, run inside do_image)
# reads ${DEPLOY_DIR_IMAGE}/grub.cfg: EXTRA_IMAGEDEPENDS only covers
# do_populate_sysroot, so the explicit ordering on do_deploy is needed too.
do_image[depends] += "grub-bootconf:do_deploy"

# meta-amd-bsp's mesa (if present in other meta-amd checkouts) conflicts with
# the openembedded-core one used here: it must not be parsed.
# At the current wrynose pin that directory no longer exists: the mask stays as
# a safety net. Keep it anchored to the full path.
BBMASK:append = " \
    meta-amd/meta-amd-bsp/recipes-graphics/mesa/ \
    "
