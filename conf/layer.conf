# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ccd"
BBFILE_PATTERN_ccd = "^${LAYERDIR}/"
# Higher than meta-voltumna (20): our bbappends (systemd, grub-bootconf,
# procps, pam...) must win over the base distro ones.
BBFILE_PRIORITY_ccd = "22"

LAYERSERIES_COMPAT_ccd = "kirkstone"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_ccd = "1"

LAYERDEPENDS_ccd = "core meta-voltumna intel amd-bsp elettra"
